general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/sysd lock command (try hyprlock!)
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep
}

# Dim screen after 2.5 mins
listener {
    timeout = 150                                
    on-timeout = brightnessctl set 10% -s       # set brightness to 10% (save current)
    on-resume = brightnessctl -r                # restore brightness
}

# Lock screen after 5 mins
listener {
    timeout = 300                               
    on-timeout = loginctl lock-session          # lock screen
}

# Turn off screen after 5.5 mins
listener {
    timeout = 330                               
    on-timeout = hyprctl dispatch dpms off      # monitor off
    on-resume = hyprctl dispatch dpms on       # monitor on
}

# Suspend laptop after 10 mins
listener {
    timeout = 600                               
    on-timeout = systemctl suspend              # suspend pc
}